[project]
name = "ev-purchase"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
  "catboost>=1.2.8",
  "joblib>=1.4",
  "jupyter>=1.1",
  "lightgbm>=4.5",
  "matplotlib>=3.9",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "numpy>=2.0",
  "numba>=0.57.0",
  "optuna>=4.0",
  "pandas>=2.2",
  "pyarrow>=18.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.6",
  "seaborn>=0.13",
  "shap>=0.46",
  "xgboost>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_purchase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
# Exclude vendored agent skills and generated notebooks from generic ruff check
extend-exclude = [".agent/skills", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
